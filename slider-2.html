<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slider-2</title>
    <link rel="stylesheet" href="./public/styles/grid.css" />
    <link rel="stylesheet" href="./public/styles/main.css" />
    <link rel="stylesheet" href="./slider-2.css" />
  </head>
  <body>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <div class="banner-three bg-primary">
            <div class="container">
              <div class="medium-2 align-center">
                <div>
                  <div>
                    <h1 class="hero-title">Exclusive Coupons &</h1>
                    <h1 class="hero-title">Huge Savings</h1>
                  </div>
                  <p>
                    Unlock thousands of verified deals and save up to 80% at
                    your favorite retailers. New coupons added daily for maximum
                    savings!
                  </p>
                  <button class="btn bg-secondary text-white">
                    Explore Now
                  </button>
                </div>
                <div class="banner-three-img">
                  <img
                    class="img-full"
                    src="https://media.istockphoto.com/id/687572186/photo/handsome-young-man-in-shopping.jpg?s=612x612&w=0&k=20&c=P5__LphyJf3BZd4ha1SKHgzv1UC_7foYccB9L6-29Qo="
                    alt=""
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="container relative">
      <div class="swiper-btn flex gap-1">
        <button class="button-prev">
          <i class="fa fa-arrow-left"></i> Prev
        </button>
        <button class="button-next">
          Next <i class="fa fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </body>
</html>
