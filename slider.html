<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <link rel="stylesheet" href="./public/styles/grid.css" />
    <link rel="stylesheet" href="./public/styles/main.css" />
    <style>
      .slider-container {
        width: 100%;
        height: 80vh;
        display: flex;
        overflow: hidden;
      }
      .slider {
        flex: 0 0 100%;
        min-width: 100%;
        height: 100%;
      }
      .slider img {
        width: 100%;
        height: 100%;
        object-fit: 100% 100%;
      }
      .slider-control {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
   <section style="height:100vh; position: relative;">
  <div class="slider-container">
    <div class="slider">
      <img src="https://www.accuratelines-eg.com/media/tz_portfolio/article/cache/residential-building-modern-84-19_XL.jpg" alt="Slide 1">
    </div>
    <div class="slider">
      <img src="https://images.unsplash.com/photo-1748100377329-429f657842de?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyNXx8fGVufDB8fHx8fA%3D%3D" alt="Slide 2">
    </div>
    <div class="slider">
      <img src="https://images.unsplash.com/photo-1726066012604-a309bd0575df?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw2MXx8fGVufDB8fHx8fA%3D%3D" alt="Slide 3">
    </div>
  </div>
  <div class="slider-control">
    <button id="prev-btn" class="bg-secondary text-white btn">Prev</button>
    <button id="next-btn" class="bg-secondary text-white btn">Next</button>
  </div>
</section>

    <script src="./vendor/slider.js"></script>
  </body>
</html>
